<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Diamond Diggin' Donal</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        color: #fff;
        font-family: monospace;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        image-rendering: pixelated;
        width: min(100vw, calc(100vh * 320 / 200));
        height: auto;
        aspect-ratio: 320 / 200;
        /* swipe controls: keep the browser from scrolling/zooming */
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <canvas id="screen" width="320" height="200"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
